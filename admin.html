<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Guestbook Admin | Balaji & Gajapriya</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#171713;--panel:#24231e;--gold:#d9bd89;--muted:#bdb6a8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#373126 0,transparent 38%),var(--bg);color:#f8f4ec;font:14px 'DM Sans',sans-serif;min-height:100vh;padding:28px 18px}main{width:min(980px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:10px}h1{font:400 clamp(30px,5vw,46px) 'Playfair Display',serif;margin:7px 0}p{color:var(--muted);line-height:1.6}.panel{background:#ffffff0b;border:1px solid #ffffff24;border-radius:18px;padding:22px;backdrop-filter:blur(14px);margin:16px 0}.login{max-width:440px;margin:12vh auto}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:10px;letter-spacing:.13em;color:var(--gold)}input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff0c;color:white;font:inherit}button,.button{border:1px solid #ffffff45;border-radius:999px;background:#d9bd89;color:#211e18;padding:11px 17px;font:600 11px 'DM Sans';letter-spacing:.08em;cursor:pointer}button.secondary{background:transparent;color:#f8f4ec}button.danger{background:#8b3d34;color:white;border-color:#8b3d34}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#ffffff0b;border:1px solid #ffffff1c;border-radius:12px;padding:12px 16px;min-width:112px}.stat strong{display:block;font:26px 'Playfair Display';color:var(--gold)}.stat span{font-size:10px;color:var(--muted);letter-spacing:.1em}.wish{display:grid;grid-template-columns:1fr auto;gap:15px;padding:16px 0;border-top:1px solid #ffffff20}.wish:first-child{border-top:0}.wish h3{margin:0 0 6px;font-size:14px}.wish p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:10px;color:#a69e90;margin-top:8px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{min-height:20px;color:var(--gold);font-size:12px}@media(max-width:600px){body{padding:18px 12px}.panel{padding:16px}.wish{grid-template-columns:1fr}.actions button{padding:9px 12px}}
</style></head><body><main>
<div id="loginPanel" class="panel login"><p class="eyebrow">BALAJI & GAJAPRIYA · PRIVATE AREA</p><h1>Guestbook Admin</h1><p>Sign in with the admin email and password you created in Supabase Authentication.</p><form id="loginForm"><div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginButton">SIGN IN</button><div class="status" id="loginStatus" role="status"></div></form></div>
<section id="dashboard" class="hidden"><div class="top"><div><p class="eyebrow">BALAJI & GAJAPRIYA · PRIVATE AREA</p><h1>Guestbook wishes</h1><p>Review, hide, restore or permanently delete messages.</p></div><button class="secondary" id="signOut">SIGN OUT</button></div><div class="panel"><div class="toolbar"><div class="stats"><div class="stat"><strong id="totalCount">—</strong><span>TOTAL</span></div><div class="stat"><strong id="visibleCount">—</strong><span>VISIBLE</span></div><div class="stat"><strong id="hiddenCount">—</strong><span>HIDDEN</span></div></div><div class="actions"><button class="secondary" id="refresh">REFRESH</button><button id="export">EXPORT CSV</button></div></div><div class="field"><label for="search">SEARCH WISHES</label><input id="search" type="search" placeholder="Search by name or message"></div><div class="status" id="adminStatus" role="status"></div><div id="wishList"></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(() => {const URL='https://fcvdcjcfjozcxgvvyxbt.supabase.co',KEY='sb_publishable_OSy9S3VU5pFFVB5AFRsSCA_o3FZz5Us';const db=window.supabase.createClient(URL,KEY);let rows=[];const $=id=>document.getElementById(id);const status=(id,msg)=>$(id).textContent=msg;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function isAdmin(){const {data,error}=await db.from('guestbook_admins').select('user_id').eq('user_id',(await db.auth.getUser()).data.user.id).maybeSingle();if(error||!data)throw new Error('This account is not listed as a guestbook admin.');}
async function load(){status('adminStatus','Loading wishes…');const {data,error}=await db.from('guestbook_wishes').select('id,name,message,created_at,is_visible').order('created_at',{ascending:false}).limit(1000);if(error){status('adminStatus','Could not load wishes: '+error.message);return;}rows=data||[];$('totalCount').textContent=rows.length;$('visibleCount').textContent=rows.filter(x=>x.is_visible).length;$('hiddenCount').textContent=rows.filter(x=>!x.is_visible).length;render();status('adminStatus','');}
function render(){const q=$('search').value.trim().toLowerCase();const list=rows.filter(r=>(r.name+' '+r.message).toLowerCase().includes(q));$('wishList').innerHTML=list.length?list.map(r=>`<article class="wish"><div><h3>${esc(r.name)} ${r.is_visible?'':'<span style="color:#d9bd89;font-size:10px">· HIDDEN</span>'}</h3><p>${esc(r.message)}</p><div class="meta">${new Date(r.created_at).toLocaleString()}</div></div><div class="actions"><button class="secondary" data-action="toggle" data-id="${esc(r.id)}">${r.is_visible?'HIDE':'RESTORE'}</button><button class="danger" data-action="delete" data-id="${esc(r.id)}">DELETE</button></div></article>`).join(''):'<p>No wishes match your search.</p>';}
$('wishList').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;b.disabled=true;if(action==='delete'&&!confirm('Permanently delete this wish? This cannot be undone.')){b.disabled=false;return;}let result;if(action==='toggle'){const row=rows.find(x=>x.id===id);result=await db.from('guestbook_wishes').update({is_visible:!row.is_visible}).eq('id',id);}else result=await db.from('guestbook_wishes').delete().eq('id',id);if(result.error)status('adminStatus','Action failed: '+result.error.message);else status('adminStatus',action==='delete'?'Wish deleted.':'Wish visibility updated.');await load();});
$('search').addEventListener('input',render);$('refresh').addEventListener('click',load);$('export').addEventListener('click',()=>{const csv=[['Name','Wish','Created at','Visible'],...rows.map(r=>[r.name,r.message,r.created_at,r.is_visible?'Yes':'No'])].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='balaji-gajapriya-guestbook.csv';a.click();URL.revokeObjectURL(a.href);});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;status('loginStatus','Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status('loginStatus',error.message);$('loginButton').disabled=false;return;}try{await isAdmin();$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');await load();}catch(err){await db.auth.signOut();status('loginStatus',err.message);$('loginButton').disabled=false;}});
$('signOut').addEventListener('click',async()=>{await db.auth.signOut();$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('loginButton').disabled=false;});
(async()=>{const {data}=await db.auth.getSession();if(data.session){try{await isAdmin();$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');await load();}catch(e){await db.auth.signOut();}}})();
})();</script></body></html>
